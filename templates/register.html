<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8fc;
        }

        .header {
            background: #12395b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 420px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #12395b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #1769aa;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #12395b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1769aa;
        }

        .login {
            text-align: center;
            margin-top: 20px;
        }

        .login a {
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>Smart Placement Preparation Platform</h1>

</div>


<div class="container">

    <h2>🎓 Student Registration</h2>

    <form method="POST" action="{{ url_for('register') }}">

        <label>Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your full name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>College</label>

        <input
            type="text"
            name="college"
            placeholder="Enter your college name"
            required
        >


        <label>Branch</label>

        <input
            type="text"
            name="branch"
            placeholder="Example: CSE"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Create a password"
            required
        >


        <button type="submit">
            Register
        </button>

    </form>


    <div class="login">

        Already registered?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </div>

</div>

</body>

</html>
