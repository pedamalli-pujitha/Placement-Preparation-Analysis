<!DOCTYPE html>
<html>

<head>

    <title>Aptitude Assessment</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f8fc;
        }

        .header {
            background: #12395b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            width: 70%;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .progress {
            color: #1769aa;
            font-size: 18px;
            font-weight: bold;
        }

        .timer {
            float: right;
            background: #eeeeee;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .question {
            font-size: 23px;
            font-weight: bold;
            margin: 35px 0 25px;
        }

        .option {
            display: block;
            background: #f1f6fa;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            cursor: pointer;
        }

        .option:hover {
            background: #dcecf8;
        }

        .option input {
            margin-right: 10px;
        }

        .button {
            margin-top: 30px;
            background: #12395b;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        .button:hover {
            background: #1769aa;
        }

    </style>

</head>


<body>


<div class="header">

    <h1>Aptitude Assessment 🧠</h1>

</div>


<div class="container">

    <div class="progress">

        Question {{ number + 1 }} of {{ total }}

        <span class="timer">
            Time: <span id="timer">30</span>s
        </span>

    </div>


    <form method="POST" id="quizForm">

        <div class="question">

            {{ question.question }}

        </div>


        {% for option in question.options %}

        <label class="option">

            <input
                type="radio"
                name="answer"
                value="{{ option }}"
                required
            >

            {{ option }}

        </label>

        {% endfor %}


        <button class="button" type="submit">

            {% if number + 1 == total %}

                Submit Assessment

            {% else %}

                Next Question →

            {% endif %}

        </button>

    </form>

</div>


<script>

let time = 30;

let timer = setInterval(function() {

    document.getElementById("timer").innerText = time;

    time--;

    if (time < 0) {

        clearInterval(timer);

        document.getElementById("quizForm").submit();

    }

}, 1000);

</script>


</body>

</html>
